<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>График производства работ — ДомСтрой</title>
<meta name="description" content="Прототип внутреннего графика производства работ: объекты, работы, бригады, поставки материалов.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F5F2">
<script>/* светлая тема по умолчанию, тёмная — если сотрудник сам её выбрал */
try{document.documentElement.setAttribute("data-theme",localStorage.getItem("ds-theme")==="dark"?"dark":"light")}
catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="icon" href="img/favicon.png" type="image/png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dhtmlx-gantt@10.0.3/codebase/dhtmlxgantt.css">
<link rel="stylesheet" href="app.css?v=2">
</head>
<body>

<header class="top">
  <a class="brand" href="#" data-go="objects" aria-label="ДомСтрой, к списку объектов">
    <img class="lg on-light" src="img/logo.png" alt="ДомСтрой" width="478" height="322">
    <img class="lg on-dark" src="img/logo-light.png" alt="" aria-hidden="true" width="478" height="322">
  </a>
  <div class="top-title">
    <b>График производства работ</b>
    <span class="proto">Прототип · данные выдуманные</span>
  </div>
  <nav class="tabs-top" aria-label="Разделы">
    <button type="button" data-go="objects" aria-pressed="true">Объекты</button>
    <button type="button" data-go="crews" aria-pressed="false">Бригады</button>
  </nav>
  <button class="icon-btn theme-btn" id="themeBtn" type="button" aria-label="Включить тёмную тему">
    <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
    <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<main>
  <!-- список объектов -->
  <section class="view" id="vObjects">
    <div class="view-head">
      <div>
        <h1>Объекты</h1>
        <p class="muted" id="objSummary"></p>
      </div>
      <button class="btn" type="button" id="newObject">+ Новый объект</button>
    </div>
    <div class="obj-grid" id="objGrid"></div>
    <p class="foot muted">Это прототип: объекты, бригады и поставщики выдуманы, изменения хранятся только в этом браузере.
      <button class="link" type="button" id="resetDemo">Вернуть исходные демо-данные</button></p>
  </section>

  <!-- график одного объекта -->
  <section class="view" id="vObject" hidden>
    <div class="obj-head">
      <button class="link back" type="button" data-go="objects">← Все объекты</button>
      <div class="obj-title">
        <h1 id="oTitle"></h1>
        <button class="icon-btn sm" type="button" id="editObject" aria-label="Изменить объект">
          <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg>
        </button>
      </div>
      <p class="muted" id="oAddress"></p>
      <div class="stats" id="oStats"></div>
    </div>

    <div class="toolbar" id="toolbar">
      <div class="seg" id="zoomSeg" role="group" aria-label="Масштаб">
        <button type="button" data-zoom="day">День</button>
        <button type="button" data-zoom="week">Неделя</button>
        <button type="button" data-zoom="month">Месяц</button>
      </div>
      <button class="tool" type="button" id="toToday">Сегодня</button>
      <label class="switch"><input type="checkbox" id="showMats" checked><span></span>Материалы</label>
      <span class="tool-sep"></span>
      <button class="tool" type="button" id="addTask">+ Работа</button>
      <button class="tool" type="button" id="addGroup">+ Этап</button>
      <button class="tool" type="button" id="addMat">+ Поставка</button>
      <span class="tool-sep"></span>
      <button class="tool" type="button" id="fixPlan">Зафиксировать план</button>
      <button class="tool" type="button" id="undoBtn" disabled>↶ Отменить</button>
      <span class="tool-sep"></span>
      <button class="tool" type="button" id="xlsBtn">Excel</button>
      <button class="tool" type="button" id="printBtn">Печать</button>
    </div>
    <p class="hint-line muted" id="hintLine"></p>
    <div class="legend" id="legend"></div>
    <div class="gantt-wrap"><div id="gantt"></div></div>
  </section>

  <!-- бригады по всем объектам -->
  <section class="view" id="vCrews" hidden>
    <div class="view-head">
      <div>
        <h1>Бригады</h1>
        <p class="muted">Кто где работает по всем объектам. Красным — бригада нужна в двух местах одновременно.</p>
      </div>
    </div>
    <div class="crew-chips" id="crewChips"></div>
    <div class="conflicts" id="conflicts"></div>
    <div class="gantt-wrap" id="crewWrap"></div>
  </section>
</main>

<!-- свои окна вместо системных: модальное, всплывающий список, уведомление -->
<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <header><h2 id="mTitle"></h2><button class="icon-btn" type="button" data-close aria-label="Закрыть">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
    <div class="modal-body" id="mBody"></div>
    <footer id="mFoot"></footer>
  </div>
</div>
<div class="pop" id="pop" hidden></div>
<div class="toast" id="toast" hidden></div>
<div id="print" aria-hidden="true"></div>

<script src="https://cdn.jsdelivr.net/npm/dhtmlx-gantt@10.0.3/codebase/dhtmlxgantt.js"></script>
<script src="data.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
